# Ringkasan pagi: berita terpenting 24 jam terakhir (WIB)
digest:
  hour_wib: 7
  top: 8

# Data pertandingan (jadwal, klasemen, statistik, lineup). Penyedia dicoba berurutan:
# ESPN (tidak resmi, tanpa kunci) -> API-Football (API_FOOTBALL_KEY) -> football-data.org (FOOTBALL_DATA_API_KEY)
football:
  espn_team_id: 360
  api_football_team_id: 33
  football_data_team_id: 66
  competitions_espn: [eng.1, uefa.champions, uefa.europa, eng.fa, eng.league_cup]
  refresh_hours: 3             # seberapa sering jadwal diperbarui
  monthly_hour_wib: 7          # jadwal bulanan otomatis tiap tanggal 1 pada jam ini
  lineup_start_minutes: 90     # mulai mengecek lineup sekian menit sebelum kick-off

# Pemantauan YouTube (butuh YOUTUBE_API_KEY): wawancara, konferensi pers, dan siaran langsung pemain atau petinggi Man Utd.
# Kanal dicari lewat handle, lalu lewat nama bila handle salah (hasilnya tampil di /diagnosa). official: true = semua
# videonya soal Man Utd, cukup memuat kata wawancara di judul. search_upcoming: true = ikut mencari siaran terjadwal
# (memakai jatah pencarian harian). Tambah atau hapus kanal cukup dengan mengedit daftar ini.
youtube:
  poll_minutes: 10
  search_every_minutes: 60
  max_search_per_day: 80
  remind_minutes: 30             # pengingat sebelum siaran terjadwal mulai
  max_age_hours: 24              # unggahan lebih tua dari ini tidak diumumkan
  channels:
    - {name: "Manchester United", handle: "@manutd", official: true, search_upcoming: true}
    - {name: "Sky Sports Football", handle: "@SkySportsFootball", search_upcoming: true}
    - {name: "Sky Sports Premier League", handle: "@SkySportsPL", search_upcoming: true}
    - {name: "Premier League", handle: "@premierleague"}
    - {name: "UEFA", handle: "@uefa"}
    - {name: "TNT Sports", handle: "@tntsports"}
    - {name: "talkSPORT", handle: "@talkSPORT"}
