# Platform besar: ditulis sebagai sumber (bersama tier1_names). Platform kecil/komunitas diganti
# nama jurnalis bila teridentifikasi di teks berita; jika tidak, nama platform tetap ditampilkan.
big_platforms:
  - Daily Mail
  - Mail Online
  - Mirror
  - Daily Mirror
  - Daily Express
  - Express
  - The Sun
  - Metro
  - Evening Standard
  - talkSPORT
  - Goal
  - Goal.com

# Penerbit di Google News yang diabaikan (feed resminya sudah dibaca langsung)
skip_publishers:
  - Manchester United
  - ManUtd.com

# Media yang dianggap sumber utama (tier 1) bila muncul lewat Google News/Reddit
