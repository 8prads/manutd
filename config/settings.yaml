# Golongan kredibilitas sumber. A = media utama/resmi, B = media andal. Sumber lain (golongan J: Football365,
# CaughtOffside, GiveMeSport, Mail, Mirror, blog fans, dll.) hanya dikirim bila artikelnya mengutip jurnalis di
# people.trusted_journalists dengan kalimat bukti yang ada di teks. Nama sumber golongan J tidak ditulis di pesan;
# yang ditulis nama jurnalis yang dikutip.
credibility:
  A:
    - ManUtd.com
    - Manchester United
    - BBC Sport
    - BBC
    - The Guardian
    - Sky Sports
    - Sky Sports News
    - ESPN
    - The Athletic
    - The Telegraph
    - The Times
    - Reuters
  B:
    - Manchester Evening News
    - The Independent
    - Evening Standard
    - talkSPORT
    - Goal
    - Goal.com

