# ============================================================
# Pengaturan bot berita Man Utd
# Ubah nilai di sini, lalu commit. Tidak ada rahasia di file ini.
# Rahasia (token, kunci API) hanya disimpan di GitHub Secrets.
# ============================================================

# Berita yang lebih tua dari ini diabaikan (jam)
max_item_age_hours: 4

# Tanggal Google News sering tidak akurat, jadi umur maksimalnya dibuat lebih pendek (jam)
gnews_max_age_hours: 1.5

filter:
  # Berita dari feed umum hanya lolos jika memuat salah satu kata ini
  keywords:
    - manchester united
    - man united
    - man utd
    - mufc
    - red devils
    - old trafford
    - carrington
    - ratcliffe
    - ineos
    - glazer
  # Berita yang memuat kata ini selalu dibuang
  exclude:
    - fantasy premier league
    - fpl
    - betting
    - odds
    - quiz
    - horoscope
    - lottery

dedupe:
  strong_threshold: 0.5      # kemiripan >= ini = berita yang sama
  mid_threshold: 0.35        # kemiripan menengah, dianggap sama jika minimal 2 nama/entitas sama
  weak_threshold: 0.25       # kemiripan lemah, dianggap sama jika 1 entitas dan jenis kejadian sama
  retention_hours: 48        # berita diingat selama ini
  merge_window_minutes: 90   # sumber baru ditambahkan ke pesan lama selama jendela ini
  max_edits: 5

cooldown:
  minutes: 15
  bypass_on_escalation: true   # RUMOR -> RESMI/BREAKING boleh langsung lewat
  bypass_on_new_facts: true    # angka/biaya/skor baru pada topik transfer, cedera, resmi

rate:
  max_per_hour: 10
  unlimited_labels: ["BREAKING NEWS", "RESMI"]

trend:
  small_sources_need_support: true   # blog/agregator butuh dukungan sumber lain
  hold_minutes: 30                   # tunggu dukungan selama ini, jika tidak ada berita dibuang
  expire_minutes: 60                 # berita yang tertahan (cooldown/batas) dibuang setelah ini
  reddit_min_score: 250
  gdelt_min_domains: 3

summary:
  long_article_chars: 2500     # artikel lebih panjang dari ini = ringkasan lebih panjang
  max_article_chars: 6000
  retry_cycles: 2              # coba ulang terjemahan sebelum memakai ringkasan Inggris
  body_max_chars: 1024         # batas karakter isi berita per bahasa (di luar headline)
  max_sentences: 5             # batas kalimat isi berita per bahasa

llm:
  # Penyedia AI. Penyedia tanpa kunci di GitHub Secrets dilewati otomatis; `enabled: false` mematikannya.
  # Nama model bisa diganti bila 404 (bot melewatinya 24 jam). Kuota harian yang habis disimpan di state sampai reset.
  # Kredit habis atau kedaluwarsa (402) menutup penyedia 30 hari dan mengirim peringatan; buka lagi dengan /ai buka <nama>.
  # Opsi per penyedia: min_interval_seconds (jeda antar panggilan), max_per_day (batas harian buatan sendiri),
  # credit_based (403 dianggap kredit habis), active_until (YYYY-MM-DD, dilewati setelah tanggal ini), extra (parameter tambahan).
  providers:
    gemini:
      kind: gemini
      key_env: GEMINI_API_KEY
      models: ["gemini-3.8-flash", "gemini-3.5-flash-lite"]
    groq:
      kind: openai
      url: "https://api.groq.com/openai/v1/chat/completions"
      key_env: GROQ_API_KEY
      models: ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]   # llama-3.3-70b-versatile dibuang: Groq menjawab 404
    github:                        # GitHub Models: kunci otomatis dari GITHUB_TOKEN workflow; batas masukan sekitar 8 ribu token
      kind: openai
      url: "https://models.github.ai/inference/chat/completions"
      key_env: GH_MODELS_TOKEN
      models: ["openai/gpt-4.1-mini", "meta/Llama-3.3-70B-Instruct"]
      min_interval_seconds: 5
      max_per_day: 120
    sambanova:                     # gratis tanpa kartu; sekitar 20 permintaan per hari per model
      kind: openai
      url: "https://api.sambanova.ai/v1/chat/completions"
      key_env: SAMBANOVA_API_KEY
      models: ["DeepSeek-V3.1", "MiniMax-M2.7"]
      max_per_day: 36
    openrouter:                    # tanpa saldo: sekitar 50 permintaan per hari (dibagi semua model gratis)
      kind: openai
      url: "https://openrouter.ai/api/v1/chat/completions"
      key_env: OPENROUTER_API_KEY
      models: ["openai/gpt-oss-120b:free", "z-ai/glm-4.7-flash:free", "meta-llama/llama-3.3-70b-instruct:free"]
      max_per_day: 45
    zai:                           # Z.ai (Zhipu): model Flash gratis, bersamaan terbatas
      kind: openai
      url: "https://api.z.ai/api/paas/v4/chat/completions"
      key_env: ZAI_API_KEY
      models: ["glm-4.7-flash", "glm-4.5-flash"]
      extra: {thinking: {type: disabled}}
      min_interval_seconds: 3
      max_per_day: 200
    nvidia:                        # NVIDIA NIM: sekitar 40 permintaan per menit, tetapi memakai kredit awal terbatas
      kind: openai
      url: "https://integrate.api.nvidia.com/v1/chat/completions"
      key_env: NVIDIA_API_KEY
      models: ["openai/gpt-oss-120b", "meta/llama-3.3-70b-instruct"]
      credit_based: true
      min_interval_seconds: 2
    cloudflare:                    # Workers AI: sekitar 10 ribu neuron per hari gratis; butuh ID akun dan token API
      kind: openai
      url: "https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/v1/chat/completions"
      key_env: CLOUDFLARE_API_TOKEN
      needs: [CLOUDFLARE_ACCOUNT_ID]
      models: ["@cf/meta/llama-3.3-70b-instruct-fp8-fast", "@cf/openai/gpt-oss-120b"]
    cerebras:                      # kredit $5 setelah menambah kartu; kredit kedaluwarsa 30 hari sejak aktivasi
      kind: openai
      url: "https://api.cerebras.ai/v1/chat/completions"
      key_env: CEREBRAS_API_KEY
      models: ["gpt-oss-120b"]
      max_param: max_completion_tokens
      min_interval_seconds: 13     # batas awal sekitar 5 permintaan per menit
      credit_based: true
      # active_until: "2026-12-25" # isi tanggal aktivasi + 30 hari agar bot berhenti memakainya sebelum kredit kedaluwarsa
    mistral:                       # tingkat gratis dilaporkan berubah; aktif hanya bila kunci diisi
      kind: openai
      url: "https://api.mistral.ai/v1/chat/completions"
      key_env: MISTRAL_API_KEY
      models: ["mistral-small-latest"]
    cohere:                        # kunci uji coba hanya untuk penggunaan non-komersial; dimatikan karena akun ini dimonetisasi
      enabled: false
      kind: openai
      url: "https://api.cohere.ai/compatibility/v1/chat/completions"
      key_env: COHERE_API_KEY
      models: ["command-a-03-2025"]
  # Urutan pakai per tugas. Pemeriksa mendahulukan penyedia yang berbeda dari penulisnya.
  order:
    write: [gemini, groq, github, sambanova, openrouter, zai, nvidia, cloudflare, cerebras, mistral]
    check: [cerebras, groq, github, sambanova, cloudflare, openrouter, zai, nvidia, gemini, mistral]
  max_calls_per_run: 40            # batas panggilan AI (menulis + memeriksa) dalam satu run
  max_seconds_per_run: 240         # setelah ini AI tidak dipanggil lagi di run itu (berita tertahan ke run berikutnya)
  check_types: [transfer, injury, manager]       # jenis kejadian yang selalu diperiksa ulang oleh AI
  check_labels: [RUMOR, SPEKULASI, TRANSFER, CEDERA]

health:
  alert_after_failures: 12     # peringatan jika sumber gagal berturut-turut (12 siklus = sekitar 1 jam)

