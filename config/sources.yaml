# ============================================================
# Daftar sumber berita.
# tier: 1 = media utama/resmi, 2 = blog/agregator, 3 = API cadangan (tertunda)
# dedicated: true = khusus Man Utd (tidak perlu disaring kata kunci)
# Sumber yang mati dilewati otomatis dan dilaporkan lewat Telegram.
# Untuk menonaktifkan sumber: tambahkan enabled: false.
# dedicated: false = berita wajib menyebut Man Utd di judul/cuplikan (untuk pencarian umum).
# mu_only: true = sumber pasti khusus Man Utd, tidak dicek ulang setelah diringkas.
# quiet: true = sumber opsional, kegagalannya tidak memicu peringatan Telegram.
# Reddit dinonaktifkan karena Reddit memblokir server GitHub (HTTP 403).
# GDELT dinonaktifkan karena server GDELT selalu timeout dari GitHub dan memperlambat tiap siklus.
# ============================================================
